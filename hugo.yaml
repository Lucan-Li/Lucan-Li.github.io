baseURL: 'https://lucan-li.github.io/'

security:
  funcs:
    getenv:
      - '^HUGO_'
      - '^CI$'
      - '^WC_'
title: Lucan Li
languageCode: en-us

module:
  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-bootstrap/v5

markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      unsafe: true

params:
  appearance:
    theme_day: academic-coffee
    theme_night: academic-coffee
    font: academic
    font_size: M

  marketing:
    seo:
      site_type: Person
      local_business_type: ''
      org_name: ''
      description: 'Personal academic website of Lucan Li'

  header:
    navbar:
      enable: true
      align: r
      show_logo: true
      show_language: false
      show_day_night: true
      show_search: false
      highlight_active_link: true

  footer:
    copyright:
      notice: '© {year} Lucan Li'

  localization:
    date_format: 'Jan 2, 2006'
    time_format: '3:04 PM'

menus:
  main:
    - name: Home
      url: '/'
      weight: 10
    - name: Experience
      url: '/experience/'
      weight: 20
    - name: Projects
      url: '/projects/'
      weight: 30
